<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Michael & Katrine — Casamento 24 de Outubro de 2026. Confirme sua presença e celebre conosco!" />
  <title>Michael & Katrine | 24.10.2026</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Lato:wght@300;400;700&family=Great+Vibes&display=swap" rel="stylesheet" />

  <!-- Supabase (reserva de presentes) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <!-- React & Babel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <style>
    /* =====================
       DESIGN TOKENS
    ===================== */
    :root {
      --gold:        #c9956c;
      --gold-light:  #e8c4a8;
      --gold-dark:   #a8724a;
      --ivory:       #fdf8f4;
      --cream:       #f7ede6;
      --deep:        #5c3d2e;
      --text:        #6b4c3b;
      --blush:       #f2d4c8;
      --sage:        #c4927a;
      --white:       #FFFFFF;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; font-size: 16px; }

    body {
      font-family: 'Lato', sans-serif;
      background: var(--ivory);
      color: var(--text);
      overflow-x: hidden;
    }

    /* =====================
       ANIMATIONS
    ===================== */
    @keyframes fadeInUp   { from { opacity:0; transform:translateY(40px) } to { opacity:1; transform:translateY(0) } }
    @keyframes fadeIn     { from { opacity:0 }                             to { opacity:1 } }
    @keyframes gradShift  { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
    @keyframes kenBurns  {
      0%   { transform:scale(1.08) translate(0px, 0px); }
      25%  { transform:scale(1.13) translate(-8px, -4px); }
      50%  { transform:scale(1.10) translate(-4px,  6px); }
      75%  { transform:scale(1.14) translate( 6px, -2px); }
      100% { transform:scale(1.08) translate(0px,  0px); }
    }
    @keyframes grainAnim {
      0%,100% { transform:translate(0,0) }
      10%  { transform:translate(-2%,-2%) }
      20%  { transform:translate(2%,1%)  }
      30%  { transform:translate(-1%,3%) }
      40%  { transform:translate(3%,-1%) }
      50%  { transform:translate(-3%,2%) }
      60%  { transform:translate(1%,-3%) }
      70%  { transform:translate(-2%,1%) }
      80%  { transform:translate(2%,-2%) }
      90%  { transform:translate(-1%,2%) }
    }
    @keyframes letterboxIn { from{opacity:0} to{opacity:1} }
    @keyframes cursorBlink { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes floatY     { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    @keyframes shimmerBar { 0%{transform:scaleX(0);transform-origin:left} 100%{transform:scaleX(1);transform-origin:left} }
    @keyframes petal-fall {
      0%   { transform:translateY(-40px) rotate(0deg)   translateX(0);   opacity:0; }
      8%   { opacity:.7; }
      92%  { opacity:.25; }
      100% { transform:translateY(105vh) rotate(540deg) translateX(80px); opacity:0; }
    }
    @keyframes dotPulse {
      0%,100% { box-shadow:0 0 0 0 rgba(201,149,108,.6) }
      50%     { box-shadow:0 0 0 8px rgba(201,149,108,0) }
    }

    /* Scroll reveals */
    .reveal        { opacity:0; transform:translateY(32px);  transition:opacity .8s cubic-bezier(.16,1,.3,1), transform .8s cubic-bezier(.16,1,.3,1); }
    .reveal-left   { opacity:0; transform:translateX(-40px); transition:opacity .8s cubic-bezier(.16,1,.3,1), transform .8s cubic-bezier(.16,1,.3,1); }
    .reveal-right  { opacity:0; transform:translateX(40px);  transition:opacity .8s cubic-bezier(.16,1,.3,1), transform .8s cubic-bezier(.16,1,.3,1); }
    .reveal.visible, .reveal-left.visible, .reveal-right.visible { opacity:1; transform:none; }

    /* =====================
       PETALS
    ===================== */
    .petals { position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden; }
    .petal  { position:absolute; top:-40px; animation:petal-fall linear infinite; }

    /* =====================
       NAV
    ===================== */
    nav {
      position:fixed; top:0; left:0; right:0; z-index:900;
      padding:22px 48px;
      transition:background .4s, padding .4s, box-shadow .4s;
    }
    nav.scrolled {
      background:rgba(253,245,238,.97);
      backdrop-filter:blur(18px);
      padding:13px 48px;
      box-shadow:0 2px 30px rgba(201,149,108,.12);
    }
    .nav-inner {
      max-width:1200px; margin:0 auto;
      display:flex; align-items:center; justify-content:space-between;
    }
    .nav-logo {
      text-decoration:none; display:flex; align-items:center;
    }
    .nav-logo img {
      height:64px; width:64px; object-fit:contain;
      mix-blend-mode:multiply;
      filter:brightness(1.1);
      transition:opacity .3s, height .4s, width .4s;
    }
    /* before scroll: logo is on dark bg — invert to show white */
    nav:not(.scrolled) .nav-logo img {
      mix-blend-mode:normal;
      filter:brightness(0) invert(1) opacity(0.92);
    }
    nav.scrolled .nav-logo img {
      height:52px; width:52px;
    }
    .nav-links { display:flex; gap:36px; list-style:none; }
    .nav-links a {
      font-size:.72rem; font-weight:400; letter-spacing:2.5px; text-transform:uppercase;
      color:rgba(255,255,255,.88); text-decoration:none; transition:color .3s;
      position:relative; padding-bottom:4px;
    }
    .nav-links a::after {
      content:''; position:absolute; bottom:0; left:0; right:0;
      height:1px; background:var(--gold);
      transform:scaleX(0); transform-origin:left; transition:transform .3s;
    }
    .nav-links a:hover::after, .nav-links a.active::after { transform:scaleX(1); }
    nav.scrolled .nav-links a                        { color:var(--text); }
    .nav-links a:hover, nav.scrolled .nav-links a:hover { color:var(--gold); }

    /* Hamburger */
    .hamburger { display:none; flex-direction:column; gap:6px; cursor:pointer; padding:4px; }
    .hamburger span { display:block; width:26px; height:1.5px; background:#fff; transition:all .3s; }
    nav.scrolled .hamburger span { background:var(--deep); }
    .hamburger.open span:nth-child(1) { transform:translateY(7.5px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity:0; }
    .hamburger.open span:nth-child(3) { transform:translateY(-7.5px) rotate(-45deg); }

    /* Mobile menu */
    .mobile-menu {
      display:none; position:fixed; inset:0; background:var(--ivory); z-index:800;
      flex-direction:column; align-items:center; justify-content:center; gap:44px;
    }
    .mobile-menu.open { display:flex; }
    .mobile-menu a {
      font-family:'Cormorant Garamond',serif; font-size:2.2rem; font-weight:400;
      color:var(--deep); text-decoration:none; letter-spacing:2px; transition:color .3s;
    }
    .mobile-menu a:hover { color:var(--gold); }
    .mobile-close {
      position:absolute; top:22px; right:28px;
      font-size:1.8rem; cursor:pointer; color:var(--deep);
      background:none; border:none; font-family:'Lato',sans-serif;
    }

    /* =====================
       HERO
    ===================== */
    .hero {
      position:relative; height:100vh; min-height:680px;
      display:flex; align-items:center; justify-content:center;
      overflow:hidden;
      background:#0a0906;
    }

    /* Wrapper para parallax (JS move este) */
    .hero-photo-wrap {
      position:absolute; inset:-6%;
      transition:transform .12s cubic-bezier(.25,.46,.45,.94);
      will-change:transform;
    }
    /* Foto com Ken Burns + color grade cinemático */
    .hero-photo {
      position:absolute; inset:0;
      background:url('hero.jpg') center 35% / cover no-repeat;
      animation:kenBurns 28s ease-in-out infinite;
      will-change:transform;
      filter:saturate(0.78) contrast(1.08) brightness(0.94) sepia(0.08);
    }
    /* Camera breathing — pulso de exposição sutil */
    .hero-breathe {
      position:absolute; inset:0; z-index:1; pointer-events:none;
      background:radial-gradient(ellipse at 50% 45%, rgba(255,255,255,.018) 0%, transparent 65%);
      animation:breathe 5s ease-in-out infinite;
    }
    @keyframes breathe {
      0%,100% { opacity:.4; }
      50%      { opacity:1; }
    }
    /* Light leak — flare de lente dourado */
    .hero-lightleak {
      position:absolute; inset:0; z-index:1; pointer-events:none;
      background:radial-gradient(ellipse at 8% 15%, rgba(255,200,80,.055) 0%, transparent 55%);
      animation:leakDrift 14s ease-in-out infinite alternate;
    }
    @keyframes leakDrift {
      from { opacity:.6; transform:translate(0,0) scale(1);    }
      to   { opacity:1;  transform:translate(6%,4%) scale(1.1); }
    }

    /* Grain cinematográfico */
    .hero-grain {
      position:absolute; inset:-50%;
      width:200%; height:200%;
      opacity:.045;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size:180px;
      animation:grainAnim .4s steps(1) infinite;
      pointer-events:none; z-index:3;
    }

    /* Overlay cinematográfico multicamada */
    .hero-overlay {
      position:absolute; inset:0; z-index:1;
      background:
        linear-gradient(to bottom, rgba(4,3,2,.65) 0%, transparent 30%),
        linear-gradient(to top, rgba(4,3,2,.80) 0%, transparent 45%),
        radial-gradient(ellipse at 50% 42%, rgba(0,0,0,.10) 0%, rgba(0,0,0,.42) 100%);
    }

    /* Fade cinematográfico topo/base (sem corte duro) */
    .hero-letterbox-top,
    .hero-letterbox-bot {
      position:absolute; left:0; right:0; height:clamp(80px,12vh,130px);
      z-index:2; pointer-events:none;
      animation:letterboxIn 1.8s ease both;
    }
    .hero-letterbox-top {
      top:0;
      background:linear-gradient(to bottom, rgba(0,0,0,.88) 0%, rgba(0,0,0,.55) 40%, transparent 100%);
    }
    .hero-letterbox-bot {
      bottom:0;
      background:linear-gradient(to top, rgba(0,0,0,.88) 0%, rgba(0,0,0,.55) 40%, transparent 100%);
    }

    /* Vinheta quente nas laterais */
    .hero-vignette {
      position:absolute; inset:0; z-index:2;
      background:radial-gradient(ellipse at 50% 50%,
        transparent 38%,
        rgba(10,8,5,.55) 70%,
        rgba(4,3,2,.88) 100%);
      pointer-events:none;
    }

    /* Leve wash dourado no centro */
    .hero-glow {
      position:absolute; width:700px; height:500px;
      top:42%; left:50%; transform:translate(-50%,-50%);
      background:radial-gradient(ellipse, rgba(176,167,82,.06) 0%, transparent 70%);
      z-index:2; pointer-events:none;
      animation:floatY 8s ease-in-out infinite;
    }
    .hero-content { position:relative; z-index:2; text-align:center; padding:20px; }
    .hero-pre {
      font-size:.68rem; letter-spacing:7px; text-transform:uppercase;
      color:rgba(201,149,108,.85); margin-bottom:18px;
      font-family:'Cormorant Garamond',serif; font-style:italic;
      animation:fadeIn 1.4s ease .3s both;
    }
    .hero-name {
      font-family:'Great Vibes',cursive;
      font-size:clamp(3.6rem,11.5vw,8rem);
      color:rgba(255,255,255,.96); line-height:1.05;
      animation:fadeInUp 1s ease .6s both;
      text-shadow:
        0 0 100px rgba(201,149,108,.12),
        0 8px 40px rgba(0,0,0,.22);
      min-height:1.15em;
    }
    .hero-cursor {
      display:inline-block;
      width:2px; height:.75em;
      background:rgba(255,255,255,.7);
      margin-left:4px;
      vertical-align:middle;
      animation:cursorBlink .75s step-end infinite;
      border-radius:1px;
    }
    .hero-amp {
      display:flex; align-items:center; justify-content:center; gap:14px;
      margin:22px auto; animation:fadeIn 1s ease .95s both;
    }
    .hero-amp::before, .hero-amp::after {
      content:''; flex:1; max-width:80px; height:1px;
      background:linear-gradient(to right, transparent, rgba(201,149,108,.5));
    }
    .hero-amp::after { background:linear-gradient(to left, transparent, rgba(201,149,108,.5)); }
    .hero-amp-diamond { color:var(--gold); font-size:.65rem; letter-spacing:4px; opacity:.8; }
    .hero-date {
      font-family:'Cormorant Garamond',serif;
      font-size:clamp(.85rem,2vw,1.05rem); font-weight:300; font-style:italic;
      letter-spacing:6px; color:rgba(255,255,255,.6);
      text-transform:uppercase;
      animation:fadeIn 1s ease 1.1s both;
    }
    .hero-line {
      width:1px; height:44px; margin:28px auto;
      background:linear-gradient(to bottom,transparent,rgba(201,149,108,.6),transparent);
      animation:fadeIn 1s ease 1.25s both;
    }

    /* Countdown */
    .countdown {
      display:flex; gap:0; justify-content:center; align-items:flex-start;
      animation:fadeInUp 1s ease 1.4s both;
    }
    .cd-box { text-align:center; padding:0 clamp(12px,3vw,28px); }
    .cd-num {
      font-family:'Cormorant Garamond',serif;
      font-size:clamp(2.6rem,6vw,4rem); font-weight:300;
      color:#fff; line-height:1; display:block;
      letter-spacing:-0.02em;
    }
    .cd-lbl {
      display:block; font-size:.58rem; letter-spacing:3px;
      text-transform:uppercase; color:rgba(201,149,108,.7); margin-top:10px;
      font-family:'Lato',sans-serif; font-weight:300;
    }
    .cd-sep {
      font-family:'Cormorant Garamond',serif; font-size:2.2rem; font-weight:300;
      color:rgba(201,149,108,.35); align-self:flex-start; margin-top:4px;
      line-height:1;
    }

    /* Logo seal in hero */
    .hero-seal {
      width:130px; height:130px; border-radius:50%;
      background:#fff;
      border:1px solid rgba(201,149,108,.3);
      box-shadow:0 0 0 8px rgba(255,255,255,.06), 0 0 0 16px rgba(255,255,255,.03);
      display:flex; align-items:center; justify-content:center;
      margin:0 auto 32px;
      animation:fadeIn 1.2s ease .3s both;
    }
    .hero-seal img { width:88px; height:88px; object-fit:contain; }


    /* =====================
       SECTION COMMONS
    ===================== */
    section { padding:100px 20px; }
    .s-inner { max-width:1080px; margin:0 auto; }
    .s-tag {
      display:block; text-align:center;
      font-size:.7rem; letter-spacing:5px; text-transform:uppercase;
      color:var(--gold); margin-bottom:14px;
    }
    .s-title {
      font-family:'Great Vibes',cursive;
      font-size:clamp(2.8rem,6vw,4.2rem); color:var(--deep);
      text-align:center; line-height:1.15; margin-bottom:28px;
    }
    .s-divider {
      width:60px; height:1px; margin:0 auto 64px;
      background:linear-gradient(to right,transparent,var(--gold),transparent);
    }
    .s-ornament { text-align:center; color:var(--gold); letter-spacing:10px; font-size:1.1rem; margin-bottom:64px; }

    /* =====================
       WELCOME
    ===================== */
    #bemvindo { background:var(--white); }
    .welcome-text {
      font-family:'Cormorant Garamond',serif;
      font-size:clamp(1.1rem,2.4vw,1.45rem); font-weight:300; font-style:italic;
      line-height:1.95; color:var(--text);
      max-width:760px; margin:0 auto; text-align:center;
    }

    /* =====================
       COUPLE
    ===================== */
    #casal { background:var(--ivory); }
    .couple-grid {
      display:grid; grid-template-columns:1fr 1fr;
      gap:72px; align-items:center;
    }
    .couple-tag   { font-size:.72rem; letter-spacing:4px; text-transform:uppercase; color:var(--gold); margin-bottom:18px; }
    .couple-h     { font-family:'Cormorant Garamond',serif; font-size:clamp(1.8rem,3.5vw,2.8rem); font-weight:400; color:var(--deep); line-height:1.3; margin-bottom:24px; }
    .couple-body  { font-size:.97rem; line-height:1.9; color:var(--text); opacity:.85; }
    .couple-body + .couple-body { margin-top:16px; }

    .couple-imgs  { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .couple-img   {
      border-radius:3px; overflow:hidden; aspect-ratio:3/4;
      background:linear-gradient(145deg,var(--cream),var(--gold-light));
      display:flex; align-items:center; justify-content:center;
      position:relative;
    }
    .couple-img:first-child { margin-top:44px; }
    .couple-img-label {
      font-family:'Great Vibes',cursive; font-size:3rem;
      color:rgba(255,255,255,.55);
    }
    .couple-img img { width:100%; height:100%; object-fit:cover; display:block; }
    .couple-img-caption {
      position:absolute; bottom:0; left:0; right:0;
      background:linear-gradient(transparent,rgba(80,45,30,.6));
      padding:20px 14px 14px;
      font-size:.72rem; letter-spacing:2px; text-transform:uppercase;
      color:rgba(255,255,255,.8); text-align:center;
    }

    /* =====================
       TIMELINE
    ===================== */
    #historia { background:var(--cream); }
    .tl-wrap { position:relative; padding:20px 0; }
    .tl-wrap::before {
      content:''; position:absolute; left:50%; top:0; bottom:0; width:1px;
      background:linear-gradient(to bottom,transparent,var(--gold-light) 15%,var(--gold-light) 85%,transparent);
      transform:translateX(-50%);
    }
    .tl-item {
      display:grid; grid-template-columns:1fr 32px 1fr;
      gap:48px; align-items:center; margin-bottom:72px;
    }
    .tl-item:last-child { margin-bottom:0; }
    .tl-left  { text-align:right; }
    .tl-right { text-align:left; }
    .tl-empty {}
    .tl-dot {
      width:14px; height:14px; border-radius:50%;
      background:var(--gold); border:3px solid var(--ivory);
      box-shadow:0 0 0 1px var(--gold);
      justify-self:center;
      animation:dotPulse 3s ease-in-out infinite;
    }
    .tl-year  { font-size:.75rem; letter-spacing:4px; color:var(--gold); font-weight:500; margin-bottom:10px; font-family:'Cormorant Garamond',serif; }
    .tl-title { font-family:'Cormorant Garamond',serif; font-size:1.55rem; font-weight:500; color:var(--deep); margin-bottom:10px; }
    .tl-desc  { font-size:.92rem; line-height:1.75; color:var(--text); opacity:.8; }

    /* =====================
       VENUE SHOWCASE
    ===================== */
    #local { padding:0; overflow:hidden; }

    .venue-cin {
      position:relative; min-height:92vh;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      overflow:hidden;
    }
    .venue-cin-bg {
      position:absolute; inset:-4%;
      background:url('mata.png') center 40% / cover no-repeat;
      animation:kenBurns 30s ease-in-out infinite;
      filter:saturate(.85) brightness(.48) contrast(1.08) sepia(.18);
      will-change:transform;
    }
    .venue-cin-overlay {
      position:absolute; inset:0;
      background:
        linear-gradient(to bottom, rgba(4,3,2,.82) 0%, transparent 28%),
        linear-gradient(to top,    rgba(4,3,2,.94) 0%, transparent 42%),
        radial-gradient(ellipse at 50% 45%, rgba(0,0,0,.08) 0%, rgba(0,0,0,.52) 100%),
        radial-gradient(ellipse at 30% 60%, rgba(180,130,60,.08) 0%, transparent 60%);
    }
    .venue-cin-vignette {
      position:absolute; inset:0; pointer-events:none;
      background:radial-gradient(ellipse at 50% 50%, transparent 35%, rgba(4,3,2,.72) 100%);
    }

    /* Linha dourada decorativa */
    .venue-cin-rule {
      width:1px; height:52px;
      background:linear-gradient(to bottom, transparent, rgba(201,149,108,.7), transparent);
      margin:0 auto 28px;
      animation:fadeIn 1s ease .3s both;
    }
    .venue-cin-content {
      position:relative; z-index:2; text-align:center;
      padding:120px 24px 60px; width:100%;
    }
    .venue-cin-tag {
      font-size:.65rem; letter-spacing:7px; text-transform:uppercase;
      color:rgba(201,149,108,.85); margin-bottom:20px; display:block;
      animation:fadeIn 1s ease .2s both;
    }
    .venue-cin-title {
      font-family:'Great Vibes',cursive;
      font-size:clamp(3.2rem,8vw,7rem);
      color:#fff; line-height:1.05;
      text-shadow:0 8px 40px rgba(0,0,0,.3);
      animation:fadeInUp .9s ease .4s both;
      margin-bottom:10px;
    }
    .venue-cin-sub {
      font-size:.7rem; letter-spacing:6px; text-transform:uppercase;
      color:var(--gold); animation:fadeIn 1s ease .65s both;
      margin-bottom:48px;
    }
    .venue-cin-desc {
      font-family:'Cormorant Garamond',serif; font-size:clamp(1rem,2.2vw,1.22rem);
      font-style:italic; color:rgba(255,255,255,.7); line-height:1.85;
      max-width:580px; margin:0 auto 56px;
      animation:fadeIn 1s ease .8s both;
    }

    /* Cards de info na base */
    .venue-cin-cards {
      display:flex; gap:1px; max-width:720px; margin:0 auto 48px;
      border:1px solid rgba(201,149,108,.2); border-radius:4px; overflow:hidden;
      background:rgba(201,149,108,.12);
      animation:fadeInUp .8s ease 1s both;
    }
    .venue-cin-card {
      flex:1; padding:26px 20px; text-align:center;
      background:rgba(10,9,5,.55); backdrop-filter:blur(12px);
      border-right:1px solid rgba(201,149,108,.15);
    }
    .venue-cin-card:last-child { border-right:none; }
    .venue-cin-card-lbl {
      font-size:.6rem; letter-spacing:3.5px; text-transform:uppercase;
      color:var(--gold); margin-bottom:8px; display:block;
    }
    .venue-cin-card-val {
      font-family:'Cormorant Garamond',serif; font-size:1.05rem;
      color:#fff; line-height:1.4;
    }

    .venue-map-btn {
      display:inline-flex; align-items:center; gap:10px;
      padding:15px 36px; border:1px solid rgba(201,149,108,.5);
      color:var(--gold-light); text-decoration:none;
      font-size:.68rem; letter-spacing:4px; text-transform:uppercase;
      border-radius:2px; transition:background .3s, color .3s;
      backdrop-filter:blur(8px); background:rgba(201,149,108,.08);
      animation:fadeIn 1s ease 1.2s both;
    }
    .venue-map-btn:hover { background:var(--gold); color:var(--deep); }

    @media (max-width:640px) {
      .venue-cin-cards { flex-direction:column; gap:0; }
      .venue-cin-card { border-right:none; border-bottom:1px solid rgba(201,149,108,.15); }
      .venue-cin-card:last-child { border-bottom:none; }
    }

    /* =====================
       CEREMONY / RECEPTION
    ===================== */
    #cerimonia  { background:var(--white); }
    #recepcao   { background:var(--cream); }

    .ev-card {
      max-width:820px; margin:0 auto;
      background:#fff; border-radius:4px;
      box-shadow:0 24px 70px rgba(0,0,0,.09);
      overflow:hidden;
    }
    #cerimonia .ev-card { background:var(--white); }

    .ev-head {
      background:linear-gradient(145deg,#5c3d2e,#6b4c3b 60%,#7a5540);
      padding:56px 40px 80px; text-align:center; position:relative;
    }
    .ev-head::after {
      content:''; position:absolute; bottom:-1px; left:0; right:0; height:64px;
      background:#fff; clip-path:ellipse(54% 100% at 50% 100%);
    }
    #cerimonia .ev-head {
      background: url('mata.png') center 38% / cover no-repeat;
      animation: kenBurns 30s ease-in-out infinite;
    }
    #cerimonia .ev-head::before {
      content:''; position:absolute; inset:0;
      background: linear-gradient(145deg, rgba(30,28,8,.82) 0%, rgba(46,42,10,.75) 60%, rgba(56,52,10,.7) 100%);
    }
    #cerimonia .ev-head .ev-icon,
    #cerimonia .ev-head .ev-title,
    #cerimonia .ev-head .ev-sub { position:relative; z-index:1; }
    #cerimonia .ev-head::after { background:var(--white); }
    #recepcao  .ev-head::after { background:#fff; }

    .ev-icon  { font-size:2.2rem; margin-bottom:18px; }
    .ev-title { font-family:'Great Vibes',cursive; font-size:3.2rem; color:#fff; margin-bottom:8px; }
    .ev-sub   { font-size:.72rem; letter-spacing:5px; text-transform:uppercase; color:var(--gold-light); }

    .ev-body  { padding:56px 48px 48px; }
    .ev-desc  {
      font-family:'Cormorant Garamond',serif; font-size:1.18rem;
      font-style:italic; line-height:1.85; color:var(--text);
      text-align:center; margin-bottom:40px;
    }
    .ev-details {
      display:grid; grid-template-columns:repeat(3,1fr); gap:24px;
      text-align:center; margin-bottom:40px;
    }
    .ev-det-icon  { font-size:1.6rem; margin-bottom:10px; }
    .ev-det-label { font-size:.68rem; letter-spacing:3px; text-transform:uppercase; color:var(--gold); margin-bottom:6px; }
    .ev-det-value { font-family:'Cormorant Garamond',serif; font-size:1.1rem; font-weight:500; color:var(--deep); }

    .map-wrap { border-radius:3px; overflow:hidden; height:280px; }
    .map-wrap iframe { width:100%; height:100%; border:none; display:block; }

    /* =====================
       GIFTS
    ===================== */
    #presentes { background:var(--white); }
    .gifts-intro {
      font-family:'Cormorant Garamond',serif; font-size:1.2rem;
      font-style:italic; line-height:1.85; color:var(--text);
      text-align:center; max-width:640px; margin:0 auto 48px;
    }

    /* Tabs */
    .gift-tabs {
      display:flex; gap:0; flex-wrap:wrap; justify-content:center;
      margin-bottom:48px; border-bottom:1px solid rgba(201,149,108,.25);
    }
    .gift-tab {
      padding:14px 24px; cursor:pointer; font-size:.72rem;
      letter-spacing:2.5px; text-transform:uppercase;
      color:var(--text); background:none; border:none;
      border-bottom:2px solid transparent; margin-bottom:-1px;
      transition:color .25s, border-color .25s;
      font-family:'Lato',sans-serif;
    }
    .gift-tab:hover  { color:var(--gold); }
    .gift-tab.active { color:var(--gold); border-bottom-color:var(--gold); font-weight:700; }

    /* Count badge */
    .gift-tab-count {
      display:inline-block; margin-left:6px;
      background:var(--gold); color:var(--deep);
      font-size:.58rem; font-weight:700; letter-spacing:0;
      padding:2px 6px; border-radius:20px; vertical-align:middle;
    }
    .gift-tab.active .gift-tab-count { background:var(--deep); color:var(--gold); }

    /* Grid */
    .gifts-grid {
      display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:28px;
    }
    .gift-card {
      background:#fff; border-radius:8px; overflow:hidden;
      box-shadow:0 4px 20px rgba(0,0,0,.06);
      transition:transform .35s cubic-bezier(.16,1,.3,1), box-shadow .35s;
      animation:fadeInUp .4s ease both;
      display:flex; flex-direction:column;
    }
    .gift-card:hover { transform:translateY(-8px); box-shadow:0 20px 48px rgba(0,0,0,.12); }
    .gift-thumb {
      height:210px; display:flex; align-items:center; justify-content:center;
      font-size:3.2rem; overflow:hidden;
      background:#f5f4f0;
      position:relative; flex-shrink:0;
    }
    .gift-thumb img { width:100%; height:100%; object-fit:contain; display:block; padding:16px; transition:transform .4s ease; }
    .gift-card:hover .gift-thumb img { transform:scale(1.06); }
    .gift-body {
      padding:20px 20px 22px;
      display:flex; flex-direction:column; flex:1;
    }
    .gift-name  {
      font-family:'Cormorant Garamond',serif; font-size:1.08rem; font-weight:500;
      color:var(--deep); margin-bottom:8px; line-height:1.4;
      flex:1;
    }
    .gift-price {
      font-family:'Cormorant Garamond',serif; font-size:1.2rem; font-weight:600;
      color:var(--gold-dark); margin-bottom:16px;
    }
    .gift-store { display:none; }
    .gift-btn {
      display:block; padding:13px; text-align:center;
      background:var(--deep); color:#fff; text-decoration:none;
      font-size:.68rem; letter-spacing:2.5px; text-transform:uppercase;
      border-radius:4px; transition:background .3s, transform .2s;
      font-family:'Lato',sans-serif; font-weight:700;
    }
    .gift-btn:hover { background:var(--gold); color:var(--deep); transform:translateY(-1px); }

    /* Gift reserved state */
    .gift-card.reserved { opacity:.88; }
    .gift-card.reserved .gift-thumb { filter:grayscale(.35); }
    .gift-card.reserved:hover { transform:none; box-shadow:0 4px 20px rgba(0,0,0,.06); }
    .gift-card.reserved .gift-thumb::after {
      content:'Já presenteado'; position:absolute; top:12px; left:12px;
      background:var(--deep); color:#fff; font-family:'Lato',sans-serif;
      font-size:.6rem; letter-spacing:1.8px; text-transform:uppercase;
      padding:6px 10px; border-radius:3px;
    }
    .gift-card.reserved .gift-price { text-decoration:line-through; opacity:.6; }
    .gift-reserved-badge {
      display:block; padding:11px; text-align:center;
      background:#e8e6d4; color:var(--sage);
      font-size:.68rem; letter-spacing:2px; text-transform:uppercase;
      border-radius:2px; pointer-events:none;
    }
    .gift-reserved-by {
      font-size:.62rem; letter-spacing:1.5px; color:var(--sage);
      margin-bottom:14px; opacity:.8;
    }
    .gift-reserve-btn {
      display:block; padding:11px; text-align:center; width:100%;
      background:transparent; border:1px solid var(--deep); color:var(--deep);
      font-size:.7rem; letter-spacing:2px; text-transform:uppercase;
      border-radius:2px; cursor:pointer; transition:background .25s, color .25s;
      font-family:'Lato',sans-serif;
    }
    .gift-reserve-btn:hover { background:var(--deep); color:#fff; }
    .gift-loading-dot { color:var(--gold); font-size:.75rem; letter-spacing:3px; }

    /* Payment modal */
    .pay-overlay {
      position:fixed; inset:0; z-index:9000;
      background:rgba(4,3,2,.80); backdrop-filter:blur(6px);
      display:flex; align-items:center; justify-content:center; padding:20px;
    }
    .pay-modal {
      background:linear-gradient(160deg,#3d2218,#5c3d2e);
      border:1px solid rgba(201,149,108,.25); border-radius:6px;
      width:100%; max-width:440px; animation:fadeInUp .35s ease;
      overflow:hidden; position:relative;
    }
    .pay-modal-header {
      padding:28px 32px 20px; border-bottom:1px solid rgba(201,149,108,.15);
    }
    .pay-modal-tag { font-size:.62rem; letter-spacing:4px; text-transform:uppercase; color:var(--gold); margin-bottom:6px; }
    .pay-modal-gift { font-family:'Cormorant Garamond',serif; font-size:1.25rem; color:#fff; font-weight:400; }
    .pay-modal-close {
      position:absolute; top:16px; right:20px;
      background:none; border:none; color:rgba(255,255,255,.4);
      font-size:1.4rem; cursor:pointer; line-height:1; transition:color .2s;
    }
    .pay-modal-close:hover { color:#fff; }
    .pay-modal-body { padding:28px 32px; }
    .pay-options { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:24px; }
    .pay-opt {
      border:1.5px solid rgba(201,149,108,.2); border-radius:4px; padding:20px 16px;
      text-align:center; cursor:pointer; transition:border-color .2s, background .2s;
      background:rgba(255,255,255,.03);
    }
    .pay-opt:hover, .pay-opt.selected { border-color:var(--gold); background:rgba(201,149,108,.08); }
    .pay-opt-icon { font-size:1.8rem; display:block; margin-bottom:8px; }
    .pay-opt-label { font-size:.68rem; letter-spacing:3px; text-transform:uppercase; color:rgba(255,255,255,.7); }
    .pay-pix-box {
      background:rgba(255,255,255,.04); border:1px solid rgba(201,149,108,.25);
      border-radius:4px; padding:20px; text-align:center; animation:fadeInUp .3s ease;
    }
    .pay-pix-key {
      font-family:'Cormorant Garamond',serif; font-size:1.15rem; color:#fff;
      background:rgba(255,255,255,.07); border:1px solid rgba(201,149,108,.3);
      border-radius:3px; padding:12px 20px; cursor:pointer; margin:12px 0;
      display:block; transition:background .2s; word-break:break-all;
    }
    .pay-pix-key:hover { background:rgba(255,255,255,.12); }
    .pay-pix-hint { font-size:.68rem; letter-spacing:2px; color:rgba(201,149,108,.7); text-transform:uppercase; }
    .pay-pix-copied { color:var(--gold); font-size:.75rem; letter-spacing:2px; height:18px; display:block; margin-top:4px; }
    .pay-card-box { background:rgba(255,255,255,.04); border:1px solid rgba(201,149,108,.25); border-radius:4px; padding:24px; text-align:center; animation:fadeInUp .3s ease; }
    .pay-card-msg { font-family:'Cormorant Garamond',serif; font-size:1.05rem; color:rgba(255,255,255,.8); line-height:1.7; margin-bottom:16px; }
    .pay-card-link { display:inline-block; padding:12px 28px; background:var(--gold); color:var(--deep); border-radius:3px; font-size:.72rem; letter-spacing:3px; text-transform:uppercase; text-decoration:none; font-weight:600; transition:background .2s; }
    .pay-card-link:hover { background:var(--gold-light); }

    /* Reservation modal */
    .reserve-overlay {
      position:fixed; inset:0; z-index:8888;
      background:rgba(10,10,2,.72); backdrop-filter:blur(4px);
      display:flex; align-items:center; justify-content:center;
      padding:20px;
    }
    .reserve-modal {
      background:#fff; border-radius:4px; padding:40px 36px;
      width:100%; max-width:420px;
      box-shadow:0 32px 80px rgba(0,0,0,.28);
      animation:fadeInUp .3s ease;
    }
    .reserve-modal h3 {
      font-family:'Cormorant Garamond',serif; font-size:1.6rem;
      color:var(--deep); margin-bottom:6px;
    }
    .reserve-modal .rm-gift { font-size:.72rem; letter-spacing:2px; color:var(--gold); text-transform:uppercase; margin-bottom:24px; }
    .reserve-modal label { display:block; font-size:.7rem; letter-spacing:2px; text-transform:uppercase; color:var(--sage); margin-bottom:6px; }
    .reserve-modal input {
      width:100%; padding:12px 14px; border:1px solid #ddd; border-radius:2px;
      font-family:'Lato',sans-serif; font-size:.95rem; color:var(--deep);
      margin-bottom:20px; box-sizing:border-box;
      transition:border-color .2s;
    }
    .reserve-modal input:focus { outline:none; border-color:var(--gold); }
    .reserve-modal-btns { display:flex; gap:12px; }
    .rm-cancel {
      flex:1; padding:13px; background:transparent; border:1px solid #ddd;
      border-radius:2px; cursor:pointer; font-size:.72rem; letter-spacing:2px;
      text-transform:uppercase; color:var(--sage); font-family:'Lato',sans-serif;
      transition:border-color .2s;
    }
    .rm-cancel:hover { border-color:var(--sage); }
    .rm-confirm {
      flex:2; padding:13px; background:var(--deep); border:none; color:#fff;
      border-radius:2px; cursor:pointer; font-size:.72rem; letter-spacing:2px;
      text-transform:uppercase; font-family:'Lato',sans-serif;
      transition:background .25s;
    }
    .rm-confirm:hover { background:var(--gold); color:var(--deep); }
    .rm-confirm:disabled { opacity:.5; cursor:not-allowed; }
    .rm-error { font-size:.75rem; color:#c0392b; margin-bottom:12px; }
    .gift-no-supabase {
      text-align:center; padding:32px 20px;
      font-size:.78rem; color:var(--sage); letter-spacing:1px; line-height:1.8;
      background:#fafaf4; border-radius:4px; border:1px dashed var(--blush);
      margin-bottom:24px;
    }

    /* Pix tab panel */
    .pix-panel {
      max-width:640px; margin:0 auto; animation:fadeInUp .4s ease both;
    }
    .pix-card {
      background:linear-gradient(135deg,var(--deep),#6b4c3b);
      border-radius:4px; padding:56px 48px; text-align:center; color:#fff;
      box-shadow:0 20px 60px rgba(0,0,0,.2);
    }
    .pix-title { font-family:'Great Vibes',cursive; font-size:3rem; color:var(--gold-light); margin-bottom:12px; }
    .pix-desc  { font-family:'Cormorant Garamond',serif; font-size:1.18rem; font-style:italic; margin-bottom:32px; opacity:.9; line-height:1.8; }
    .pix-key   {
      display:inline-block; padding:16px 32px;
      background:rgba(255,255,255,.08); border:1px solid rgba(201,149,108,.4);
      border-radius:3px; font-size:1.05rem; letter-spacing:1px; color:var(--gold-light);
      cursor:pointer; transition:background .3s;
    }
    .pix-key:hover { background:rgba(255,255,255,.13); }
    .pix-copied { font-size:.75rem; letter-spacing:2px; color:var(--gold); margin-top:12px; display:block; height:20px; }
    .pix-amounts {
      display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-top:32px;
    }
    .pix-amount {
      padding:10px 22px; border:1px solid rgba(201,149,108,.35); border-radius:2px;
      font-family:'Cormorant Garamond',serif; font-size:1rem; color:rgba(255,255,255,.7);
      font-style:italic;
    }

    @media (max-width:600px) {
      .gift-tab { padding:11px 14px; font-size:.66rem; letter-spacing:1.5px; }
    }

    /* =====================
       RSVP
    ===================== */
    #rsvp {
      background:linear-gradient(145deg,#5c3d2e 0%,#6b4c3b 60%,#3d2218 100%);
    }
    #rsvp .s-tag   { color:var(--gold-light); }
    #rsvp .s-title { color:#fff; }
    .rsvp-intro {
      font-family:'Cormorant Garamond',serif; font-size:1.2rem;
      font-style:italic; color:rgba(255,255,255,.78);
      text-align:center; max-width:580px; margin:0 auto 52px; line-height:1.85;
    }
    .rsvp-form {
      max-width:600px; margin:0 auto;
      background:rgba(255,255,255,.05); border:1px solid rgba(201,149,108,.2);
      border-radius:4px; padding:52px 44px; backdrop-filter:blur(12px);
    }
    .f-group { margin-bottom:28px; }
    .f-label { display:block; font-size:.68rem; letter-spacing:3.5px; text-transform:uppercase; color:var(--gold); margin-bottom:10px; }
    .f-input {
      width:100%; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14);
      border-radius:2px; padding:14px 16px; color:#fff;
      font-family:'Lato',sans-serif; font-size:.97rem;
      transition:border-color .3s; outline:none; resize:vertical;
    }
    .f-input::placeholder { color:rgba(255,255,255,.32); }
    .f-input:focus { border-color:var(--gold); }
    .f-input option { background:#5c3d2e; }
    .f-row { display:grid; grid-template-columns:1fr 1fr; gap:20px; }

    .radio-grp { display:flex; gap:14px; }
    .radio-opt { flex:1; }
    .radio-opt input { display:none; }
    .radio-opt label {
      display:block; padding:13px; text-align:center;
      border:1px solid rgba(255,255,255,.15); border-radius:2px;
      cursor:pointer; color:rgba(255,255,255,.65);
      font-size:.78rem; letter-spacing:2px; text-transform:uppercase;
      transition:all .3s;
    }
    .radio-opt input:checked + label { border-color:var(--gold); color:var(--gold); background:rgba(201,149,108,.1); }

    .submit-btn {
      width:100%; margin-top:8px; padding:18px;
      background:var(--gold); border:none; border-radius:2px;
      color:var(--deep); font-family:'Lato',sans-serif;
      font-size:.78rem; font-weight:700; letter-spacing:4px; text-transform:uppercase;
      cursor:pointer; transition:background .3s, transform .2s;
    }
    .submit-btn:hover { background:var(--gold-light); transform:translateY(-2px); }
    .submit-btn:active { transform:translateY(0); }
    .submit-btn:disabled { opacity:.6; cursor:not-allowed; transform:none; }

    .rsvp-success { text-align:center; padding:60px 30px; }
    .success-icon  { font-size:4rem; display:block; margin-bottom:24px; }
    .success-title { font-family:'Great Vibes',cursive; font-size:3.2rem; color:var(--gold-light); margin-bottom:16px; }
    .success-msg   { font-family:'Cormorant Garamond',serif; font-size:1.2rem; font-style:italic; color:rgba(255,255,255,.8); line-height:1.8; }

    /* =====================
       FOOTER
    ===================== */
    footer {
      background:#0c0c01; padding:72px 20px;
      text-align:center;
    }
    .ft-logo { display:block; margin-bottom:14px; }
    .ft-logo img { height:110px; width:110px; object-fit:contain; mix-blend-mode:screen; filter:brightness(1.4) saturate(1.1); }
    .ft-date { font-size:.7rem; letter-spacing:6px; text-transform:uppercase; color:rgba(255,255,255,.35); margin-bottom:36px; }
    .ft-div  { width:60px; height:1px; background:linear-gradient(to right,transparent,var(--gold-dark),transparent); margin:0 auto 36px; }
    .ft-love { font-size:.8rem; color:rgba(255,255,255,.28); letter-spacing:1px; }
    .ft-love span { color:var(--gold); }

    /* =====================
       RESPONSIVE
    ===================== */
    @media (max-width:900px) {
      .couple-grid { grid-template-columns:1fr; }
      .couple-imgs  { order:-1; max-width:400px; margin:0 auto; }
      .ev-details   { grid-template-columns:1fr; gap:20px; }
      .ev-body      { padding:48px 28px 40px; }
    }

    @media (max-width:768px) {
      nav { padding:16px 20px; }
      nav.scrolled { padding:12px 20px; }
      .nav-links { display:none; }
      .hamburger { display:flex; }
      section { padding:72px 16px; }
      .tl-wrap::before { left:16px; }
      .tl-item { grid-template-columns:auto 1fr; grid-template-rows:auto; gap:20px; }
      .tl-left  { text-align:left; order:2; grid-column:2; }
      .tl-right { grid-column:2; }
      .tl-empty { display:none; }
      .tl-dot   { order:1; }
      .f-row    { grid-template-columns:1fr; }
      .rsvp-form { padding:36px 24px; }
      .pix-card { padding:36px 24px; }
      .countdown { gap:10px; }
      .cd-sep { display:none; }
      .ev-head { padding:44px 24px 70px; }
    }

    @media (max-width:480px) {
      .gifts-grid { grid-template-columns:1fr 1fr; }
    }

    @media (max-width:360px) {
      .gifts-grid { grid-template-columns:1fr; }
    }


    /* =====================
       ADMIN PANEL
    ===================== */
    .admin-wrap {
      min-height:100vh; background:#0c0b07; color:#fff;
      font-family:'Lato',sans-serif; padding:0;
    }
    .admin-header {
      background:rgba(10,9,5,.97);
      backdrop-filter:blur(16px);
      border-bottom:1px solid rgba(201,149,108,.15);
      padding:16px 32px;
      display:flex; align-items:center; gap:16px;
      position:sticky; top:0; z-index:100;
    }
    .admin-logo {
      font-family:'Great Vibes',cursive; font-size:1.9rem; color:var(--gold);
      flex:1; white-space:nowrap;
    }
    .admin-badge { display:none; }

    /* Countdown — layout horizontal compacto */
    .admin-countdown {
      display:flex; gap:0; align-items:stretch;
      background:rgba(201,149,108,.08); border:1px solid rgba(201,149,108,.18);
      border-radius:10px; overflow:hidden;
    }
    .admin-countdown-item {
      text-align:center; padding:8px 14px;

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    /* ─── HOOKS ─── */
    function useCountdown(target) {
      const calc = () => {
        const diff = new Date(target) - new Date();
        if (diff <= 0) return { days:0, hours:0, minutes:0, seconds:0 };
        return {
          days:    Math.floor(diff / 86400000),
          hours:   Math.floor((diff % 86400000) / 3600000),
          minutes: Math.floor((diff % 3600000)  / 60000),
          seconds: Math.floor((diff % 60000)    / 1000),
        };
      };
      const [t, setT] = useState(calc);
      useEffect(() => { const id = setInterval(() => setT(calc()), 1000); return () => clearInterval(id); }, []);
      return t;
    }

    function useReveal() {
      useEffect(() => {
        const obs = new IntersectionObserver(
          es => es.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); }),
          { threshold: 0.12 }
        );
        setTimeout(() => {
          document.querySelectorAll('.reveal,.reveal-left,.reveal-right').forEach(el => obs.observe(el));
        }, 100);
        return () => obs.disconnect();
      }, []);
    }

    function useScrolled() {
      const [scrolled, setScrolled] = useState(false);
      useEffect(() => {
        const fn = () => setScrolled(window.scrollY > 70);
        window.addEventListener('scroll', fn, { passive:true });
        return () => window.removeEventListener('scroll', fn);
      }, []);
      return scrolled;
    }

    /* ─── LOADING SCREEN ─── */
    const LS_FULL = 'Michael & Katrine';

    const LoadingScreen = ({ onEnter }) => {
      const [exit,    setExit]    = useState(false);
      const [showBtn, setShowBtn] = useState(false);
      const [typed,   setTyped]   = useState('');
      const [cursor,  setCursor]  = useState(true);

      useEffect(() => {
        document.body.style.overflow = 'hidden';
        // Typewriter
        let i = 0;
        const iv = setInterval(() => {
          i++;
          setTyped(LS_FULL.slice(0, i));
          if (i >= LS_FULL.length) {
            clearInterval(iv);
            // Mostra botão após a digitação terminar
            setTimeout(() => setShowBtn(true), 150);
          }
        }, 45);
        return () => clearInterval(iv);
      }, []);

      const handleEnter = () => {
        if (exit) return;
        setExit(true);
        setTimeout(() => {
          document.body.style.overflow = '';
          onEnter();
        }, 600);
      };

      return (
        <div
          className={`ls-wrap${exit ? ' ls-exit' : ''}`}
          onClick={handleEnter}
          aria-label="Entrar no site"
        >
          {/* Pétalas de fundo */}
          <div className="ls-petals-wrap">
            {PETALS.map(p => (
              <div key={p.id} className="petal" style={{
                left: p.left,
                animationDuration: p.duration,
                animationDelay: p.delay,
              }}>
                <svg width={p.size} height={p.size * 1.3} viewBox="0 0 20 26">
                  <ellipse cx="10" cy="13" rx="8" ry="12"
                    fill="rgba(212,175,155,0.55)"
                    transform="rotate(-25 10 13)" />
                </svg>
              </div>
            ))}
          </div>
          {/* Brilho central dourado */}
          <div className="ls-glow" />
          {/* Conteúdo */}
          <div className="ls-content">
            <div className="ls-name">
              {typed}
              {cursor && <span className="hero-cursor" aria-hidden="true" />}
            </div>
            <div className="ls-date">24 · 10 · 2026</div>
            {showBtn && (
              <div className="ls-enter-wrap" onClick={handleEnter}>
                <div className="ls-enter-ring" />
                <button className="ls-enter-btn">Entrar</button>
              </div>
            )}
            {showBtn && <div className="ls-hint">toque para começar</div>}
          </div>
        </div>
      );
    };

    /* ─── MUSIC PLAYER ─── */
    /*
     * ─── COMO USAR SUA PRÓPRIA MÚSICA ────────────────────────────────
     * Opção A) Arquivo local:
     *   Salve o MP3 como "musica.mp3" na mesma pasta do index.html
     *   e substitua a URL abaixo por:  src="musica.mp3"
     *
     * Opção B) Link direto (YouTube, Spotify não funcionam — use um
     *   link direto de MP3, ex: do Google Drive com permissão pública):
     *   Substitua MUSIC_SRC pela URL do seu arquivo.
     * ──────────────────────────────────────────────────────────────────
     */
    const MUSIC_SRC = "musica.mp3";
    // ^ Diga Sim Pra Mim — Desejo de Menina (Violino Cover)

    /* audioRef, playing, setPlaying live in App — LoadingScreen starts the music on click */
    const MusicPlayer = ({ audioRef, playing, setPlaying }) => {
      const [error, setError] = useState(false);

      useEffect(() => {
        const audio = audioRef.current;
        if (!audio) return;
        audio.addEventListener('error', () => setError(true));
      }, []);

      const toggle = async () => {
        const audio = audioRef.current;
        if (error || !audio) return;
        if (playing) {
          audio.pause();
          setPlaying(false);
        } else {
          try { await audio.play(); setPlaying(true); } catch {}
        }
      };

      if (error) return null;

      return (
        <button
          className={`mp-btn${playing ? ' playing' : ''}`}
          onClick={toggle}
          aria-label={playing ? 'Pausar música' : 'Tocar música'}
        >
          <span className="mp-tooltip">{playing ? 'Pausar música' : 'Tocar música'}</span>
          <span className="mp-icon mp-disc">{playing ? '🎵' : '🎶'}</span>
        </button>
      );
    };

    /* ─── PETALS ─── */
    const PETALS = Array.from({ length: 14 }, (_, i) => ({
      id: i,
      left: `${5 + (i * 7.1) % 90}%`,
      duration: `${9 + (i * 3.7) % 11}s`,
      delay:    `${(i * 2.3) % 12}s`,
      size:     14 + (i % 5) * 4,
    }));

    const Petals = () => (
      <div className="petals" aria-hidden="true">
        {PETALS.map(p => (
          <div key={p.id} className="petal" style={{
            left: p.left,
            animationDuration: p.duration,
            animationDelay: p.delay,
          }}>
            <svg width={p.size} height={p.size * 1.3} viewBox="0 0 20 26">
              <ellipse cx="10" cy="13" rx="8" ry="12"
                fill="rgba(212,165,160,0.45)"
                transform="rotate(-25 10 13)" />
            </svg>
          </div>
        ))}
      </div>
    );

    /* ─── NAVBAR ─── */
    const NAV_LINKS = [
      { href:'#inicio',    label:'Início'       },

        let raf;
        let cx = 0, cy = 0;
        let tx = 0, ty = 0;
        const isMobile = window.matchMedia('(pointer:coarse)').matches;

        const handleMouse = (e) => {
          tx = (e.clientX / window.innerWidth  - 0.5) * 22;
          ty = (e.clientY / window.innerHeight - 0.5) * 14;
        };

        // baseline para calibrar o giroscópio na posição inicial do usuário
        let baseGamma = null, baseBeta = null;
        const handleOrientation = (e) => {
          if (baseGamma === null) { baseGamma = e.gamma; baseBeta = e.beta; }
          const dg = Math.max(-30, Math.min(30, (e.gamma - baseGamma)));
          const db = Math.max(-25, Math.min(25, (e.beta  - baseBeta)));
          tx =  (dg / 30) * 18;
          ty =  (db / 25) * 12;
        };

        const animate = () => {
          cx += (tx - cx) * 0.06;
          cy += (ty - cy) * 0.06;
          if (wrapRef.current) {
            wrapRef.current.style.transform = `translate(${cx}px, ${cy}px)`;
          }
          raf = requestAnimationFrame(animate);
        };

        if (isMobile) {
          // iOS 13+ exige permissão explícita
          if (typeof DeviceOrientationEvent !== 'undefined' &&
              typeof DeviceOrientationEvent.requestPermission === 'function') {
            // adiciona listener no primeiro toque para pedir permissão
            const askPermission = () => {
              DeviceOrientationEvent.requestPermission().then(state => {
                if (state === 'granted')
                  window.addEventListener('deviceorientation', handleOrientation, { passive: true });
              }).catch(() => {});
              window.removeEventListener('touchstart', askPermission);
            };
            window.addEventListener('touchstart', askPermission, { once: true });
          } else {
            window.addEventListener('deviceorientation', handleOrientation, { passive: true });
          }
        } else {
          window.addEventListener('mousemove', handleMouse, { passive: true });
        }

        raf = requestAnimationFrame(animate);
        return () => {
          window.removeEventListener('mousemove', handleMouse);
          window.removeEventListener('deviceorientation', handleOrientation);
          cancelAnimationFrame(raf);
        };
      }, []);

    /* Hook: carrega reservas e permite reservar */
    function useGiftReservations() {
      const [reservations, setReservations] = useState({}); // { giftId: guestName }
      const [ready,        setReady]        = useState(false);

      useEffect(() => {
        if (!supabaseClient) { setReady(true); return; }

        supabaseClient
          .from('gift_reservations')
          .select('gift_id, guest_name')
          .then(({ data }) => {
            if (data) {
              const map = {};
              data.forEach(r => { map[r.gift_id] = r.guest_name; });
              setReservations(map);
            }
            setReady(true);
          });

        // Atualizações em tempo real
        const channel = supabaseClient
          .channel('gift_changes')
          .on('postgres_changes',
            { event: 'INSERT', schema: 'public', table: 'gift_reservations' },
            ({ new: row }) => setReservations(prev => ({ ...prev, [row.gift_id]: row.guest_name }))
          )
          .subscribe();

        return () => supabaseClient.removeChannel(channel);
      }, []);

      const reserve = async (giftId, guestName) => {
        if (!supabaseClient) return 'no-supabase';
        const { error } = await supabaseClient
          .from('gift_reservations')
          .insert({ gift_id: giftId, guest_name: guestName });
        if (!error) {
          setReservations(prev => ({ ...prev, [giftId]: guestName }));
          return 'ok';
        }
        // Código 23505 = violação de unique (já reservado)
        return 'taken';
      };

      return { reservations, ready, reserve };
    }

          const ms = target - new Date();
          if (ms <= 0) { setDiff({d:0,h:0,m:0,s:0}); return; }
          const d = Math.floor(ms/86400000);
          const h = Math.floor((ms%86400000)/3600000);
          const m = Math.floor((ms%3600000)/60000);
          const s = Math.floor((ms%60000)/1000);
          setDiff({d,h,m,s});
        };
        tick();
        const id = setInterval(tick, 1000);
        return () => clearInterval(id);
      }, []);
      if (diff.d === undefined) return null;
      const pad = n => String(n).padStart(2,'0');
      return (
        <div className="admin-countdown">
          {[{v:diff.d,l:'dias'},{v:diff.h,l:'h'},{v:diff.m,l:'min'},{v:diff.s,l:'seg'}].map((item,i) => (

      const [status, setStatus] = useState('idle');

      const pct = confirmed > 0 ? Math.min(100, Math.round((confirmed / Math.max(confirmed, 1)) * 100)) : 0;
      const set  = e => setForm(f => ({ ...f, [e.target.name]: e.target.value }));

      const submit = async e => {
        e.preventDefault();
        setStatus('loading');
        try {
          if (supabaseClient) {
            // Verifica se já confirmou
            const { data: existing } = await supabaseClient
              .from('rsvps')
              .select('id')
              .ilike('guest_name', form.name.trim())
              .limit(1);

            if (existing && existing.length > 0) {
              setStatus('duplicate');
              return;
            }

            await supabaseClient.from('rsvps').insert({
              guest_name:     form.name.trim(),
              attending:      form.attendance === 'sim',
              adults_count:   parseInt(form.adults)   || 1,
              children_count: form.hasChildren === 'sim' ? (parseInt(form.children) || 0) : 0,
              phone:          form.phone  || null,
              notes:          form.notes  || null,
            });
          }
        } catch (err) { console.error('RSVP error:', err); }
        if (form.attendance === 'sim') onConfirm(form.name, parseInt(form.adults));
        setStatus('done');
      };

      return (
        <section id="rsvp">
          <div className="s-inner">
            <div className="reveal" style={{textAlign:'center'}}>
              <span className="s-tag">Confirmação de Presença</span>
              <h2 className="s-title">Você Vai?</h2>
              <div className="s-divider" style={{marginBottom:'32px'}} />
            </div>


            {status !== 'done' ? (
              <>
                <p className="rsvp-intro" style={{animation:'fadeInUp .7s ease .2s both'}}>
                  A sua presença é muito importante para nós! Por favor, confirme até{' '}
                  <strong style={{color:'var(--gold-light)'}}>30 de setembro de 2026</strong>.
                </p>
                <form className="rsvp-form" style={{animation:'fadeInUp .7s ease .35s both'}} onSubmit={submit}>
                  <div className="f-group">
                    <label className="f-label">Seu Nome *</label>
                    <input
                      className="f-input" type="text" required
                      placeholder="Digite seu nome..."
                      value={form.name}
                      onChange={e => setForm(f => ({ ...f, name: e.target.value }))}
                    />
                  </div>

                  <div className="f-group">
                    <label className="f-label">Você irá ao evento? *</label>
                    <div className="radio-grp">
                      <div className="radio-opt">
                        <input type="radio" id="r-sim" name="attendance" value="sim"
                          checked={form.attendance==='sim'} onChange={set} />
                        <label htmlFor="r-sim">✓ Sim, irei!</label>
                      </div>
                      <div className="radio-opt">
                        <input type="radio" id="r-nao" name="attendance" value="nao"
                          checked={form.attendance==='nao'} onChange={set} />
                        <label htmlFor="r-nao">✗ Não poderei ir</label>
                      </div>
                    </div>
                  </div>

                  {form.attendance === 'sim' && (
                    <div className="f-group">
                      <label className="f-label">Vai levar crianças?</label>
                      <div className="radio-grp">
                        <div className="radio-opt">
                          <input type="radio" id="c-nao" name="hasChildren" value="nao"
                            checked={form.hasChildren !== 'sim'} onChange={set} />
                          <label htmlFor="c-nao">Não</label>
                        </div>
                        <div className="radio-opt">
                          <input type="radio" id="c-sim" name="hasChildren" value="sim"
                            checked={form.hasChildren === 'sim'} onChange={set} />
                          <label htmlFor="c-sim">Sim</label>
                        </div>
                      </div>
                    </div>
                  )}

                  {form.attendance === 'sim' && form.hasChildren === 'sim' && (
                    <div className="f-group">
                      <label className="f-label">Quantas crianças?</label>
                      <select className="f-input" name="children" value={form.children} onChange={set}>
                        {[1,2,3,4,5].map(n => <option key={n} value={n}>{n}</option>)}
                      </select>
                    </div>
                  )}

                  <div className="f-group">
                    <label className="f-label">Telefone / WhatsApp</label>
                    <input className="f-input" type="tel" name="phone"
                      placeholder="(31) 99999-9999" value={form.phone} onChange={set} />
                  </div>

                  {form.attendance === 'nao' && (
                    <div className="f-group">
                      <label className="f-label">Motivo / Observações</label>
                      <textarea className="f-input" name="notes" rows="3"
                        placeholder="Conte-nos o motivo se quiser..."
                        value={form.notes} onChange={set} />
                    </div>
                  )}

                  <button type="submit" className="submit-btn" disabled={status==='loading'}>
                    {status === 'loading' ? 'Enviando…' : 'Confirmar Presença'}
                  </button>
                </form>
              </>
            ) : status === 'duplicate' ? (
              <div className="rsvp-form rsvp-success" style={{animation:'fadeInUp .8s cubic-bezier(.16,1,.3,1) both'}}>
                <span className="success-icon">💌</span>
                <div className="success-title">Já recebemos!</div>
                <p className="success-msg">
                  <strong style={{color:'var(--gold-light)',fontStyle:'normal'}}>{form.name.split(' ')[0]}</strong>, sua presença já foi confirmada anteriormente.<br /><br />
                  Não é necessário confirmar novamente. Te esperamos! 💛
                </p>
              </div>
            ) : (
              <div className="rsvp-form rsvp-success" style={{animation:'fadeInUp .8s cubic-bezier(.16,1,.3,1) both'}}>
                {form.attendance === 'sim' ? (<>
                  <span className="success-icon">🤍</span>
                  <div className="success-title">Que alegria!</div>
                  <p className="success-msg">
                    Ficaremos muito felizes com a sua presença,{' '}
                    <strong style={{color:'var(--gold-light)',fontStyle:'normal'}}>{form.name.split(' ')[0]}</strong>!<br /><br />
                    Muito obrigado por fazer parte deste dia tão especial para nós.<br />
                    Te esperamos com todo nosso amor! 💛
                  </p>
                  <div style={{marginTop:'32px',fontSize:'.68rem',letterSpacing:'4px',textTransform:'uppercase',color:'rgba(255,255,255,.35)'}}>
                    24 · 10 · 2026
                  </div>
                </>) : (<>
                  <span className="success-icon">🙏</span>
                  <div className="success-title">Que pena...</div>
                  <p className="success-msg">
                    Agradecemos imensamente por nos avisar,{' '}
                    <strong style={{color:'var(--gold-light)',fontStyle:'normal'}}>{form.name.split(' ')[0]}</strong>.<br /><br />
                    Você estará em nossos corações neste dia tão especial.<br />
                    Que Deus abençoe a sua vida sempre! 💛
                  </p>
                </>)}
              </div>
            )}
          </div>
        </section>
      );
    };

    /* ─── FOOTER ─── */
    const Footer = () => (
      <footer>
        <span className="ft-logo"><img src="logo.png" alt="Monograma KM" /></span>
        <div className="ft-date">24 · 10 · 2026</div>
        <div className="ft-div" />
        <p className="ft-love">Feito com <span>♥</span> para o dia mais especial das nossas vidas</p>
      </footer>
    );

    /* ─── APP ─── */
    const VENUE_MAP = "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d60116.84!2d-42.5376!3d-19.4683!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xa5482b579753e1%3A0x6a3e9b4c2f4c1d9e!2sIpatinga%2C%20MG!5e0!3m2!1spt-BR!2sbr!4v1700000000000!5m2!1spt-BR!2sbr";

    const App = () => {
      // Modo admin: acesse ?admin=mk2026
      const isAdmin = new URLSearchParams(window.location.search).get('admin') === ADMIN_PASS;
      if (isAdmin) return <AdminPanel />;

      const [loading,    setLoading]    = useState(true);
      const [active,     setActive]     = useState('inicio');
      const [confirmed,  setConfirmed]  = useState(INITIAL_CONFIRMED);
      const [playing,    setPlaying]    = useState(false);
      const audioRef = useRef(null);
      useReveal();

      useEffect(() => {
        const sections = document.querySelectorAll('section[id]');
        const obs = new IntersectionObserver(
          es => es.forEach(e => { if (e.isIntersecting) setActive(e.target.id); }),
          { threshold: 0.3 }
        );
        sections.forEach(s => obs.observe(s));
        return () => obs.disconnect();
      }, []);

      const handleConfirm = useCallback((name, adults) => {
        setConfirmed(c => c + adults);
      }, []);

      /* Called by LoadingScreen on user click — satisfies browser autoplay policy */
      const handleEnter = useCallback(() => {
        setLoading(false);
        const audio = audioRef.current;
        if (!audio) return;
        audio.volume = 0.3;
        audio.loop   = true;
        audio.play().then(() => setPlaying(true)).catch(() => {});
      }, []);

      return (
        <>
          <audio ref={audioRef} src={MUSIC_SRC} preload="auto" />
          {loading && <LoadingScreen onEnter={handleEnter} />}
          <Petals />
          <MusicPlayer audioRef={audioRef} playing={playing} setPlaying={setPlaying} />
          <Navbar active={active} />
          <Hero />
          <Welcome />
          <Couple />
          <Timeline />
          <EventSection
            id="cerimonia" bg="var(--white)"
            tag="Casamento Civil" title="Cerimônia" icon="💒"
            date="24 de Outubro de 2026" time="15h00"
            location="Barra Alegre, 899 — Damata Casa de Campo, Ipatinga"
            desc="Convidamos todos vocês para o momento mais especial das nossas vidas — nossa união civil. Será uma celebração repleta de emoção, amor e gratidão por cada um que fará parte deste dia inesquecível."
            mapSrc={VENUE_MAP}
            mapsLink="https://maps.google.com/?q=Damata+Casa+de+Campo+Barra+Alegre+899+Ipatinga+MG"
          />
          <Gifts />
          <RSVP confirmed={confirmed} onConfirm={handleConfirm} />
          <Footer />
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
